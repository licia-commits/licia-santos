<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist Anti-Glosa</title>
<link rel="icon" type="image/png" href="../assets/monogram.png">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2EDE6;--surface:#FFF;--ink:#1A1916;--muted:#5A5650;--gold:#B89A5A;--gold-2:#D4B97A;--dark:#1A1916;--on-dark:#F2EDE6;--line:#DDD5CA;--chip:#F7F2EA;--hi:#A23B2A;--mid:#B88A2A;--lo:#2E7D4F;
--display:'Cormorant Garamond',Georgia,serif;--body:'DM Sans','Helvetica Neue',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--surface:#23211E;--ink:#F2EDE6;--muted:#ADA59A;--dark:#0D0C0B;--line:#3A3630;--chip:#2B2824;--hi:#E88B7A;--mid:#E3BF6A;--lo:#6FCB94;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141311;--surface:#23211E;--ink:#F2EDE6;--muted:#ADA59A;--dark:#0D0C0B;--line:#3A3630;--chip:#2B2824;--hi:#E88B7A;--mid:#E3BF6A;--lo:#6FCB94;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--dark);color:var(--on-dark);padding:28px 16px;text-align:center}
header small{letter-spacing:.14em;text-transform:uppercase;font-size:.72rem;color:var(--gold-2)}
header h1{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,5vw,2.3rem);margin:6px 0 4px;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;margin-top:18px}
.card h2{font-family:var(--display);font-weight:600;font-size:1.3rem;margin:0 0 4px}.sub{color:var(--muted);font-size:.88rem;margin:0 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--chip);cursor:pointer;margin-top:8px;font-size:.9rem}
.opt:has(input:checked){border-color:var(--lo)}.opt input{accent-color:var(--gold);margin-top:3px}
.btn{display:block;width:100%;margin-top:20px;padding:15px;border:0;border-radius:8px;background:var(--gold);color:#1A1916;font:600 1rem var(--body);cursor:pointer}
.res{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;margin-top:18px}
.res h2{font-family:var(--display);font-weight:600;margin:0 0 10px}
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.score b{font-family:var(--display);font-size:2.6rem}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:600;border:1.5px solid currentColor}
.hi{color:var(--hi)}.mid{color:var(--mid)}.lo{color:var(--lo)}
.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--gold)}
h3{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:16px 0 6px}
ul{padding-left:18px;font-size:.9rem;margin:0}
.wa{display:flex;justify-content:center;margin-top:16px;padding:15px;border-radius:8px;background:#25D366;color:#fff;text-decoration:none;font-weight:600}
.disc{font-size:.76rem;color:var(--muted);text-align:center;margin-top:22px}
</style>
<link rel="stylesheet" href="tema-site.css">
<script src="../analytics.js" defer></script>
</head>
<body>
<script>if(window.self!==window.top)document.body.classList.add("embedded")</script>
<nav class="topbar"><a href="../index.html" aria-label="Lícia Santos Advocacia, início"><img src="../assets/logo.png" alt="Lícia Santos Advocacia"></a><a href="../index.html" class="topbar__back">← Voltar ao site</a></nav>
<header><small>Lícia Santos Advocacia · Direito Médico</small><h1>Sua clínica está blindada contra glosas?</h1><p style="opacity:.8;margin:0">Marque o que já existe. O resultado mostra onde a operadora vai glosar primeiro.</p></header>
<div class="wrap" id="form"></div>
<script>
const WHATS='5584999968266';
const BLOCOS=[
 {t:'Contrato e tabela',s:'A base de qualquer cobrança',i:[
  ['Contrato de credenciamento assinado e localizável, com todos os aditivos',3],
  ['Cláusula de reajuste anual com índice definido (Lei 13.003/2014)',3],
  ['Tabela de procedimentos (TUSS/CBHPM) vigente anexa ao contrato',2],
  ['Prazos de pagamento, de recurso de glosa e de resposta da operadora escritos no contrato',2],
  ['Regra de materiais/medicamentos/OPME (tabela, marca, reembolso) definida',2]]},
 {t:'Autorização e elegibilidade',s:'Onde nasce a glosa administrativa',i:[
  ['Guia TISS autorizada (número e validade) arquivada junto da conta',3],
  ['Elegibilidade do beneficiário conferida no dia do atendimento',2],
  ['Prorrogação de internação / sessões adicionais solicitada e registrada antes de executar',2],
  ['Negativas e silêncios da operadora registrados com protocolo e data',2]]},
 {t:'Prontuário e evidência clínica',s:'O que sustenta a cobrança no recurso e em juízo',i:[
  ['Evolução médica e de enfermagem diária, assinada e datada (físico ou PEP certificado)',3],
  ['Prescrição médica compatível com tudo que foi faturado (medicamento, material, exame)',3],
  ['Relatório/laudo justificando procedimentos de alto custo ou fora da rotina',2],
  ['Termo de consentimento informado assinado quando aplicável',1],
  ['Rastreabilidade de OPME (etiqueta/lote) anexada à conta',2]]},
 {t:'Faturamento e envio',s:'Erro de forma vira glosa certa',i:[
  ['Conferência da conta por segunda pessoa antes do envio (dupla checagem)',2],
  ['Código TUSS, quantidade e valor de tabela conferidos item a item',3],
  ['Envio dentro do prazo contratual, com protocolo XML TISS guardado',2],
  ['Controle de contas enviadas × pagas × glosadas por operadora e mês',3]]},
 {t:'Recurso de glosa',s:'Dinheiro que fica na mesa',i:[
  ['Demonstrativo de glosa lido e classificado por motivo em até 5 dias',2],
  ['Recurso administrativo enviado dentro do prazo contratual, com documentos',3],
  ['Registro de recursos sem resposta e glosas mantidas (base para cobrança judicial)',3],
  ['Análise jurídica periódica das glosas mantidas antes de prescrever',3]]}
];
const form=document.getElementById('form');
BLOCOS.forEach((b,bi)=>{form.insertAdjacentHTML('beforeend',`<div class="card"><h2>${bi+1}. ${b.t}</h2><p class="sub">${b.s}</p>${b.i.map((x,ii)=>`<label class="opt"><input type="checkbox" data-b="${bi}" data-w="${x[1]}"><span>${x[0]}</span></label>`).join('')}</div>`)});
form.insertAdjacentHTML('beforeend',`<button class="btn" id="calc">Ver meu nível de proteção</button><div class="res" id="res" hidden></div><p class="disc">Checklist informativo baseado no padrão TISS, na Lei 13.003/2014 e em resoluções do CFM. Não substitui auditoria. Lícia Santos · OAB/RN 6.470</p>`);
document.getElementById('calc').onclick=()=>{
  let tot=0,got=0,porBloco=[];
  BLOCOS.forEach((b,bi)=>{let t=0,g=0;document.querySelectorAll(`input[data-b="${bi}"]`).forEach(i=>{t+=+i.dataset.w;if(i.checked)g+=+i.dataset.w});tot+=t;got+=g;porBloco.push({t:b.t,p:Math.round(g/t*100),faltas:[...document.querySelectorAll(`input[data-b="${bi}"]:not(:checked)`)].map(i=>i.nextElementSibling.textContent)})});
  const p=Math.round(got/tot*100);
  const nivel=p>=80?['lo','Proteção alta']:p>=55?['mid','Proteção parcial']:['hi','Exposição alta'];
  const pior=[...porBloco].sort((a,b)=>a.p-b.p).slice(0,2);
  const r=document.getElementById('res');
  r.innerHTML=`<h2>Resultado</h2><div class="score"><b>${p}%</b><span class="badge ${nivel[0]}">${nivel[1]}</span></div><div class="bar"><i style="width:${p}%"></i></div>
  <h3>Onde a operadora vai glosar primeiro</h3><ul>${pior.map(b=>`<li><b>${b.t}</b> (${b.p}%)<ul>${b.faltas.slice(0,3).map(f=>`<li>${f}</li>`).join('')}</ul></li>`).join('')}</ul>
  <h3>Próximo passo</h3><p style="font-size:.92rem">${p>=80?'Estrutura boa. O ganho agora está em revisar as glosas mantidas dos últimos anos antes que prescrevam.':p>=55?'Há lacunas que geram glosa recorrente. Uma auditoria de faturamento costuma se pagar no primeiro ciclo de recursos.':'A clínica está exposta a glosa sistemática e a dificuldade de cobrar em juízo. Priorize contrato, prontuário e controle de contas.'}</p>
  <a class="wa" id="wa" target="_blank" rel="noopener">Enviar este resultado para a Dra. Lícia</a>`;
  const msg=`Olá, Dra. Lícia. Fiz o checklist anti-glosa no site.\n• Proteção: ${p}% (${nivel[1]})\n• Pontos mais fracos: ${pior.map(b=>b.t+' '+b.p+'%').join('; ')}\nQuero conversar sobre auditoria de faturamento e glosas.`;
  document.getElementById('wa').href=`https://wa.me/${WHATS}?text=${encodeURIComponent(msg)}`;
  r.hidden=false;r.scrollIntoView({behavior:'smooth'});
  try{(window.dataLayer=window.dataLayer||[]).push({event:'checklist_antiglosa',score:p})}catch(e){}
};
</script>
</body>
</html>
